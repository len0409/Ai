name: Android Release Build

on:
  push:
    branches: ["master", "main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Generate release keystore
        run: |
          keytool -genkey -v -keystore release.keystore -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=AI Relay, OU=Dev, O=AI Relay, L=City, ST=State, C=CN"

      - name: Build Release APK
        run: KEYSTORE_PASSWORD=android ./gradlew assembleRelease

      - name: Generate version tag
        id: version
        run: |
          echo "tag=v2.5.3" >> $GITHUB_OUTPUT
          echo "name=AI Relay v2.5.3 正式版" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/AI-Relay-v2.5.3.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: |
            ## AI Relay v2.5.3 正式版

            - 升级 Kotlin 1.9.22 + Compose 编译器 1.5.11
            - 升级 Compose BOM 2024.06 + 全套 AndroidX 最新版
            - 移除 enableEdgeToEdge（部分设备兼容问题）
            - 全局 try-catch + Compose 错误页面
          files: app/build/outputs/apk/release/AI-Relay-v2.5.3.apk
          generate_release_notes: true
