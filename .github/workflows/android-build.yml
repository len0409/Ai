name: Android Release Build

on:
  push:
    branches: ["master", "main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Generate release keystore
        run: |
          keytool -genkey -v -keystore release.keystore -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=AI Relay, OU=Dev, O=AI Relay, L=City, ST=State, C=CN"

      - name: Build Release APK
        run: KEYSTORE_PASSWORD=android ./gradlew assembleRelease

      - name: Generate version tag
        id: version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "tag=v2.5.2-${COMMIT_COUNT}" >> $GITHUB_OUTPUT
          echo "name=AI Relay v2.5.2 正式版" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/AI-Relay-v2.5.2.apk
          ls -lh app/build/outputs/apk/release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: |
            ## AI Relay v2.5.2 正式版

            纯原生 View 启动，无 Compose 依赖，逐行初始化并输出日志。

            下载 `AI-Relay-v2.5.2.apk` 安装后，屏幕会显示初始化状态。
            如果黑屏或闪退，说明 Application 或系统依赖层已崩溃。
          files: app/build/outputs/apk/release/AI-Relay-v2.5.2.apk
          generate_release_notes: true
