name: Android Release Build

on:
  push:
    branches: ["master", "main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Generate release keystore
        run: |
          keytool -genkey -v -keystore release.keystore -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=AI Relay, OU=Dev, O=AI Relay, L=City, ST=State, C=CN"

      - name: Build Release APK
        run: KEYSTORE_PASSWORD=android ./gradlew assembleRelease

      - name: Generate version tag
        id: version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "tag=v2.5.0-${COMMIT_COUNT}" >> $GITHUB_OUTPUT
          echo "name=AI Relay v2.5.0 (正式版 #${COMMIT_COUNT})" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/AI-Relay-v2.5.0.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: |
            ## AI Relay 正式版 v2.5.0

            签名 Release APK，可直接安装。

            ### 安装
            下载下方 `AI-Relay-v2.5.0.apk` 安装即可。

            ### 构建信息
            - Commit: ${{ github.sha }}
            - 变更: ${{ github.event.head_commit.message }}
          files: app/build/outputs/apk/release/AI-Relay-v2.5.0.apk
          generate_release_notes: true
